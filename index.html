<script>
const API_URL = 'https://scoutpicks-backend-1.onrender.com/api/partidos-hoy';

async function render() {
  const container = document.getElementById('picks');
  container.innerHTML = '<p class="why">Cargando partidos...</p>';

  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error('Error HTTP ' + response.status);

    const data = await response.json();
    const partidos = data.response || [];

    if (!partidos.length) {
      container.innerHTML = '<p class="why">La API no devolvió partidos para hoy.</p>';
      return;
    }

    container.innerHTML = partidos.map(p => {
      const local = p.teams?.home?.name || 'Local';
      const visita = p.teams?.away?.name || 'Visita';
      const liga = p.league?.name || '';
      const hora = p.fixture?.date
        ? new Date(p.fixture.date).toLocaleTimeString('es-CL', {
            hour: '2-digit', minute: '2-digit', timeZone: 'America/Santiago'
          })
        : '';
      const estado = p.fixture?.status?.short || '';
      const golesLocal = p.goals?.home ?? '-';
      const golesVisita = p.goals?.away ?? '-';

      return `
        <article class="card">
          <div class="tag">${liga}</div>
          <div class="pick">${local} – ${visita}</div>
          <p class="why">Hora: ${hora} · Estado: ${estado}</p>
          <div class="stats">
            <div class="stat"><span class="muted">Goles local</span><b>${golesLocal}</b></div>
            <div class="stat"><span class="muted">Goles visita</span><b>${golesVisita}</b></div>
          </div>
        </article>`;
    }).join('');
  } catch (error) {
    container.innerHTML =
      '<p class="why">No se pudieron cargar los partidos. Revisa la conexión del backend.</p>';
    console.error(error);
  }
}

document.querySelector('button[onclick]').onclick = render;
render();
</script>
